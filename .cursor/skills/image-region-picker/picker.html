<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Region Picker</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3846;
      --text: #e8eef4;
      --muted: #93a1b0;
      --accent: #3dd6c6;
      --accent-dim: #1a4f49;
      --danger: #ff7a7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body { display: flex; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex-wrap: wrap;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
    .hint { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
    button, .file-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #24303b;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }
    button:hover, .file-btn:hover { border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      color: #062421;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.05); }
    #file { display: none; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 280px;
      min-height: 0;
    }
    .stage-wrap {
      position: relative;
      overflow: auto;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .drop {
      width: min(720px, 90%);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 64px 24px;
      text-align: center;
      color: var(--muted);
    }
    .drop.drag { border-color: var(--accent); color: var(--accent); }
    .canvas-box { position: relative; display: inline-block; line-height: 0; }
    #photo {
      max-width: 100%;
      max-height: calc(100vh - 140px);
      display: block;
      cursor: crosshair;
      user-select: none;
      -webkit-user-drag: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    aside {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
    .point {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .badge {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); color: #062421;
      font-size: 11px; font-weight: 700;
      display: grid; place-items: center; flex: 0 0 20px;
    }
    .empty { color: var(--muted); padding: 8px 0; }
    pre {
      background: #0f1419;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .status { margin-top: 12px; color: var(--accent); font-size: 12px; min-height: 1.4em; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Image Region Picker</h1>
    <div class="hint">Upload an image, click 4 points, then Confirm. The region is copied so you can paste it into the Cursor chat (⌘V).</div>
    <div class="actions">
      <label class="file-btn">Upload image<input id="file" type="file" accept="image/*"></label>
      <button id="undo" disabled>Undo last</button>
      <button id="reset" disabled>Reset points</button>
      <button id="confirm" class="primary" disabled>Confirm region</button>
    </div>
  </header>
  <main>
    <div class="stage-wrap" id="stage">
      <div class="drop" id="drop">Drop an image here, or use Upload image</div>
    </div>
    <aside>
      <h2>Points</h2>
      <div id="list"><div class="empty">No points yet. Click the image 4 times.</div></div>
      <h2 style="margin-top:20px">Region</h2>
      <pre id="output">Waiting for 4 points…</pre>
      <div class="status" id="status"></div>
    </aside>
  </main>
  <script>
    const fileInput = document.getElementById("file");
    const stage = document.getElementById("stage");
    const drop = document.getElementById("drop");
    const list = document.getElementById("list");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const undoBtn = document.getElementById("undo");
    const resetBtn = document.getElementById("reset");
    const confirmBtn = document.getElementById("confirm");

    let img = null;
    let overlay = null;
    let box = null;
    let points = [];
    let fileName = "image";
    let confirmed = null;

    function naturalPoint(event, image) {
      const rect = image.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (image.naturalWidth / rect.width);
      const y = (event.clientY - rect.top) * (image.naturalHeight / rect.height);
      return {
        x: Math.max(0, Math.min(image.naturalWidth, Math.round(x))),
        y: Math.max(0, Math.min(image.naturalHeight, Math.round(y))),
      };
    }

    function regionFromPoints(pts, image) {
      const xs = pts.map((p) => p.x);
      const ys = pts.map((p) => p.y);
      const x = Math.min(...xs);
      const y = Math.min(...ys);
      const x2 = Math.max(...xs);
      const y2 = Math.max(...ys);
      return {
        image: fileName,
        imageWidth: image.naturalWidth,
        imageHeight: image.naturalHeight,
        points: pts.map((p) => ({ x: p.x, y: p.y })),
        boundingBox: { x, y, x2, y2, width: x2 - x, height: y2 - y },
      };
    }

    function draw() {
      if (!overlay || !img) return;
      const w = img.clientWidth;
      const h = img.clientHeight;
      overlay.setAttribute("viewBox", `0 0 ${w} ${h}`);
      overlay.setAttribute("width", w);
      overlay.setAttribute("height", h);
      const sx = w / img.naturalWidth;
      const sy = h / img.naturalHeight;
      const to = (p) => ({ x: p.x * sx, y: p.y * sy });
      const mapped = points.map(to);
      let markup = "";
      if (mapped.length >= 2) {
        const d = mapped.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ") + (mapped.length === 4 ? " Z" : "");
        markup += `<path d="${d}" fill="${mapped.length === 4 ? "rgba(61,214,198,.18)" : "none"}" stroke="#3dd6c6" stroke-width="2" />`;
      }
      if (mapped.length === 4) {
        const r = regionFromPoints(points, img).boundingBox;
        markup += `<rect x="${r.x * sx}" y="${r.y * sy}" width="${r.width * sx}" height="${r.height * sy}" fill="none" stroke="#3dd6c6" stroke-dasharray="5 4" stroke-width="1.5" />`;
      }
      mapped.forEach((p, i) => {
        const tipX = p.x;
        const tipY = p.y;
        markup += `
          <polygon points="${tipX},${tipY} ${tipX - 8},${tipY - 22} ${tipX + 8},${tipY - 22}" fill="#3dd6c6" />
          <circle cx="${tipX}" cy="${tipY - 30}" r="11" fill="#3dd6c6" />
          <text x="${tipX}" y="${tipY - 26}" text-anchor="middle" font-size="12" font-weight="700" fill="#062421">${i + 1}</text>
          <text x="${tipX + 14}" y="${tipY - 8}" font-size="11" fill="#e8eef4">${points[i].x}, ${points[i].y}</text>
        `;
      });
      overlay.innerHTML = markup;
    }

    function renderList() {
      undoBtn.disabled = points.length === 0;
      resetBtn.disabled = points.length === 0 && !img;
      confirmBtn.disabled = points.length !== 4;
      if (!points.length) {
        list.innerHTML = '<div class="empty">No points yet. Click the image 4 times.</div>';
      } else {
        list.innerHTML = points.map((p, i) =>
          `<div class="point"><span class="badge">${i + 1}</span><span>x ${p.x}</span><span>y ${p.y}</span></div>`
        ).join("");
      }
      if (points.length === 4 && img) {
        output.textContent = JSON.stringify(regionFromPoints(points, img), null, 2);
      } else {
        output.textContent = `Waiting for ${4 - points.length} more point${4 - points.length === 1 ? "" : "s"}…`;
      }
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      fileName = file.name || "image";
      points = [];
      confirmed = null;
      status.textContent = "";
      const url = URL.createObjectURL(file);
      stage.innerHTML = "";
      box = document.createElement("div");
      box.className = "canvas-box";
      img = document.createElement("img");
      img.id = "photo";
      img.alt = fileName;
      overlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      overlay.id = "overlay";
      img.onload = () => {
        URL.revokeObjectURL(url);
        draw();
        renderList();
      };
      img.addEventListener("click", (event) => {
        if (points.length >= 4) return;
        points.push(naturalPoint(event, img));
        draw();
        renderList();
      });
      box.append(img, overlay);
      stage.append(box);
      img.src = url;
      window.addEventListener("resize", draw);
    }

    stage.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
    stage.addEventListener("dragleave", () => drop.classList.remove("drag"));
    stage.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("drag");
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));
    undoBtn.addEventListener("click", () => { points.pop(); confirmed = null; status.textContent = ""; draw(); renderList(); });
    resetBtn.addEventListener("click", () => { points = []; confirmed = null; status.textContent = ""; draw(); renderList(); });
    function regionMessage(region) {
      const pts = region.points.map((pt) => `(${pt.x}, ${pt.y})`).join(", ");
      const b = region.boundingBox;
      return [
        `Selected region for image "${region.image}" (${region.imageWidth}×${region.imageHeight}):`,
        `bounding box: x=${b.x}, y=${b.y}, x2=${b.x2}, y2=${b.y2} (width ${b.width}, height ${b.height})`,
        `points: ${pts}`,
        "",
        "Please edit only this region and keep every pixel outside it unchanged.",
      ].join("\n");
    }
    confirmBtn.addEventListener("click", async () => {
      if (points.length !== 4 || !img) return;
      confirmed = regionFromPoints(points, img);
      const text = regionMessage(confirmed);
      output.textContent = text;
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = "Region copied. Switch to Cursor, click the chat input, and press ⌘V.";
      } catch (_) {
        status.textContent = "Could not copy automatically. Select the text on the right and copy it, then paste into the Cursor chat.";
      }
    });
    renderList();
  </script>
</body>
</html>
